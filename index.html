<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CYBER-TRACE // AI Phone Locator</title>

  <!-- Leaflet CSS & Fonts -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  
  <!-- Supabase JS & Leaflet JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    :root {
      --neon-cyan: #00f3ff;
      --neon-green: #39ff14;
      --neon-red: #ff0055;
      --bg-dark: #070b13;
      --card-bg: rgba(13, 22, 38, 0.85);
      --border-glow: rgba(0, 243, 255, 0.4);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Rajdhani', sans-serif; }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 15% 20%, rgba(0, 243, 255, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 85% 80%, rgba(57, 255, 20, 0.08) 0%, transparent 40%);
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
    }

    /* Glow Header */
    header {
      text-align: center;
      margin: 15px 0 25px;
    }

    .logo {
      font-family: 'Orbitron', sans-serif;
      font-size: 26px;
      font-weight: 900;
      letter-spacing: 2px;
      color: #fff;
      text-shadow: 0 0 10px var(--neon-cyan), 0 0 20px var(--neon-cyan);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    /* Radar Pulse Animation */
    .radar-pulse {
      width: 14px;
      height: 14px;
      background: var(--neon-cyan);
      border-radius: 50%;
      box-shadow: 0 0 0 rgba(0, 243, 255, 0.7);
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(0, 243, 255, 0.7); }
      70% { box-shadow: 0 0 0 16px rgba(0, 243, 255, 0); }
      100% { box-shadow: 0 0 0 0 rgba(0, 243, 255, 0); }
    }

    /* Glass Neon Card */
    .neon-panel {
      width: 100%;
      max-width: 760px;
      background: var(--card-bg);
      border: 1px solid var(--border-glow);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 8px 32px 0 rgba(0, 243, 255, 0.15);
      backdrop-filter: blur(10px);
      margin-bottom: 20px;
    }

    /* Auth Forms */
    .auth-toggle {
      display: flex;
      gap: 10px;
      margin-bottom: 18px;
    }
    .toggle-btn {
      flex: 1;
      padding: 10px;
      background: transparent;
      border: 1px solid rgba(0,243,255,0.2);
      color: #94a3b8;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: 0.3s;
    }
    .toggle-btn.active {
      border-color: var(--neon-cyan);
      color: var(--neon-cyan);
      box-shadow: 0 0 10px rgba(0,243,255,0.3);
    }

    .input-group {
      margin-bottom: 14px;
    }
    input {
      width: 100%;
      padding: 14px 16px;
      background: rgba(4, 9, 20, 0.7);
      border: 1px solid rgba(0, 243, 255, 0.3);
      border-radius: 8px;
      color: #fff;
      font-size: 16px;
      outline: none;
      transition: 0.3s;
    }
    input:focus {
      border-color: var(--neon-cyan);
      box-shadow: 0 0 15px rgba(0, 243, 255, 0.5);
    }

    .btn-action {
      width: 100%;
      padding: 14px;
      background: linear-gradient(90deg, #00b4d8, #00f3ff);
      color: #030811;
      font-weight: 700;
      font-size: 17px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      letter-spacing: 1px;
      box-shadow: 0 0 15px rgba(0, 243, 255, 0.4);
      transition: 0.3s;
    }
    .btn-action:hover {
      box-shadow: 0 0 25px rgba(0, 243, 255, 0.8);
      transform: translateY(-1px);
    }

    .btn-google {
      width: 100%;
      padding: 12px;
      background: #111a2e;
      border: 1px solid #334155;
      color: #fff;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-top: 12px;
      transition: 0.3s;
    }
    .btn-google:hover {
      border-color: #94a3b8;
      background: #1a2744;
    }

    /* Map Box */
    #map {
      height: 420px;
      width: 100%;
      border-radius: 12px;
      margin-top: 15px;
      border: 1px solid var(--border-glow);
      box-shadow: 0 0 15px rgba(0, 243, 255, 0.15);
    }

    /* Alerts and Status */
    .status-msg {
      margin-top: 14px;
      padding: 12px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 15px;
      display: none;
    }
    .status-warn {
      background: rgba(255, 0, 85, 0.15);
      border: 1px solid var(--neon-red);
      color: #ff4d79;
    }
    .status-ok {
      background: rgba(57, 255, 20, 0.15);
      border: 1px solid var(--neon-green);
      color: var(--neon-green);
    }

    /* Admin Badge */
    .user-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 14px;
      border-bottom: 1px solid rgba(0,243,255,0.2);
      margin-bottom: 18px;
    }
    .badge {
      background: rgba(0, 243, 255, 0.2);
      padding: 4px 10px;
      border-radius: 20px;
      color: var(--neon-cyan);
      font-size: 13px;
    }
    .logout-btn {
      color: #ff4d79;
      background: none;
      border: none;
      cursor: pointer;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">
      <div class="radar-pulse"></div>
      CYBER-TRACE // LIVE LOCATOR
    </div>
    <p style="color: #64748b; font-size: 14px; margin-top: 4px;">एआई-पावर्ड रियल-टाइम एंटी-थेफ्ट नेटवर्क</p>
  </header>

  <!-- AUTH SECTION (लॉगिन / साइनअप) -->
  <div id="authPanel" class="neon-panel">
    <div class="auth-toggle">
      <button class="toggle-btn active" id="tabLogin" onclick="switchAuth('login')">लॉगिन</button>
      <button class="toggle-btn" id="tabSignup" onclick="switchAuth('signup')">नया अकाउंट बनाएं</button>
    </div>

    <div class="input-group">
      <input type="email" id="authEmail" placeholder="ईमेल पता दर्ज करें..." required />
    </div>
    <div class="input-group">
      <input type="password" id="authPass" placeholder="पासवर्ड..." required />
    </div>

    <button class="btn-action" id="authSubmitBtn" onclick="handleAuth()">पोर्टल में प्रवेश करें</button>

    <div style="text-align: center; margin: 15px 0; color: #64748b; font-size: 14px;">— अथवा —</div>

    <button class="btn-google" onclick="loginWithGoogle()">
      <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#EA4335" d="M12 5c1.6 0 3 .6 4.1 1.6l3.1-3.1C17.3 1.7 14.8 1 12 1 7.5 1 3.7 3.6 1.9 7.4l3.7 2.9C6.5 7.4 9 5 12 5z"/><path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.7-.2-2.3H12v4.6h6.5c-.3 1.5-1.1 2.8-2.4 3.7l3.7 2.9c2.2-2 3.7-5.1 3.7-8.9z"/><path fill="#FBBC05" d="M5.6 14.7c-.2-.7-.4-1.6-.4-2.7s.2-2 .4-2.7L1.9 6.4C.7 8.8 0 10.8 0 12s.7 3.2 1.9 5.6l3.7-2.9z"/><path fill="#34A853" d="M12 23c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3 0-5.5-2.4-6.4-5.3L1.9 16c1.8 3.8 5.6 7 10.1 7z"/></svg>
      Continue with Google
    </button>

    <div id="authStatus" class="status-msg"></div>
  </div>

  <!-- TRACKING & MAP SECTION (लॉगिन होने के बाद दिखेगा) -->
  <div id="trackerPanel" class="neon-panel" style="display: none;">
    <div class="user-bar">
      <div>
        <span class="badge" id="userEmailBadge">user@domain.com</span>
      </div>
      <button class="logout-btn" onclick="logout()">लॉगआउट</button>
    </div>

    <div style="display: flex; gap: 10px;">
      <input type="tel" id="trackPhone" placeholder="रजिस्टर्ड मोबाइल नंबर (उदा. 7609991888)..." style="flex: 1;" />
      <button class="btn-action" style="width: 140px;" onclick="trackDevice()">लोकेट करें</button>
    </div>

    <div id="trackStatus" class="status-msg"></div>

    <!-- OpenStreetMap Container -->
    <div id="map"></div>
  </div>

  <script>
    // 1. Supabase Client Setup (आपकी क्रेडेंशियल्स)
    const SUPABASE_URL = "https://dlblovrjihvvthpbplan.supabase.co";
    const SUPABASE_KEY = "Sb_secret_I3drRJY__eNnOZaxjLZT5w_LetdK_9C";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let authMode = 'login';
    let map = null;
    let marker = null;

    // चेक करें कि यूजर पहले से लॉगिन है या नहीं
    async function checkSession() {
      const { data: { session } } = await supabase.auth.getSession();
      if (session) {
        showTracker(session.user.email);
      } else {
        document.getElementById('authPanel').style.display = 'block';
        document.getElementById('trackerPanel').style.display = 'none';
      }
    }
    checkSession();

    function switchAuth(mode) {
      authMode = mode;
      document.getElementById('tabLogin').classList.toggle('active', mode === 'login');
      document.getElementById('tabSignup').classList.toggle('active', mode === 'signup');
      document.getElementById('authSubmitBtn').innerText = mode === 'login' ? 'पोर्टल में प्रवेश करें' : 'नया अकाउंट रजिस्टर करें';
    }

    // ईमेल/पासवर्ड ऑथेंटिकेशन
    async function handleAuth() {
      const email = document.getElementById('authEmail').value.trim();
      const password = document.getElementById('authPass').value.trim();
      const msg = document.getElementById('authStatus');

      if (!email || !password) {
        showMsg(msg, 'कृपया ईमेल और पासवर्ड दोनों दर्ज करें!', 'warn');
        return;
      }

      showMsg(msg, 'सत्यापन किया जा रहा है...', 'ok');

      if (authMode === 'signup') {
        const { data, error } = await supabase.auth.signUp({ email, password });
        if (error) return showMsg(msg, error.message, 'warn');
        showMsg(msg, 'खाता तैयार! यदि पुष्टिकरण ईमेल भेजा गया है तो उसे चेक करें अथवा लॉगिन करें।', 'ok');
      } else {
        const { data, error } = await supabase.auth.signInWithPassword({ email, password });
        if (error) return showMsg(msg, error.message, 'warn');
        showTracker(data.user.email);
      }
    }

    // Google Sign-In
    async function loginWithGoogle() {
      const { error } = await supabase.auth.signInWithOAuth({
        provider: 'google',
        options: { redirectTo: window.location.origin }
      });
      if (error) alert(error.message);
    }

    async function logout() {
      await supabase.auth.signOut();
      window.location.reload();
    }

    function showTracker(email) {
      document.getElementById('authPanel').style.display = 'none';
      document.getElementById('trackerPanel').style.display = 'block';
      document.getElementById('userEmailBadge').innerText = email;

      // Leaflet Map इनिशियलाइज़ेशन
      setTimeout(() => {
        if (!map) {
          map = L.map('map').setView([20.5937, 78.9629], 5);
          // डार्क/नियॉन टाइल्स (CartoDB DarkMatter - फ्री बिना की के)
          L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap © CARTO'
          }).addTo(map);
        } else {
          map.invalidateSize();
        }
      }, 200);
    }

    // मोबाइल ट्रैकिंग सर्च
    async function trackDevice() {
      const phone = document.getElementById('trackPhone').value.trim();
      const statusBox = document.getElementById('trackStatus');

      if (!phone) {
        showMsg(statusBox, 'कृपया मोबाइल नंबर दर्ज करें!', 'warn');
        return;
      }

      showMsg(statusBox, 'सैटेलाइट नेटवर्क से सिग्नल प्राप्त किया जा रहा है...', 'ok');

      const { data, error } = await supabase
        .from('device_tracking')
        .select('*')
        .eq('registered_phone', phone)
        .single();

      if (error || !data) {
        showMsg(statusBox, 'त्रुटि: डेटाबेस में इस नंबर से कोई एक्टिव सिग्नल नहीं मिला!', 'warn');
        return;
      }

      const lat = data.latitude;
      const lon = data.longitude;
      const isSimChanged = data.sim_status === 'CHANGED';

      map.setView([lat, lon], 16);
      if (marker) marker.remove();

      // कस्टम नियॉन मार्कर
      const markerHtml = `
        <div style="background:${isSimChanged ? '#ff0055' : '#00f3ff'};width:18px;height:18px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 12px ${isSimChanged ? '#ff0055' : '#00f3ff'};"></div>
      `;
      const customIcon = L.divIcon({ html: markerHtml, className: '' });

      marker = L.marker([lat, lon], { icon: customIcon }).addTo(map)
        .bindPopup(`
          <div style="color:#0f172a; font-family:sans-serif;">
            <b style="font-size:15px;">📡 सिग्नल लॉक हुआ</b><br>
            <b>नंबर:</b> ${data.registered_phone}<br>
            <b>सिम स्थिति:</b> ${isSimChanged ? '<span style="color:red;font-weight:bold;">⚠️ सिम बदला गया!</span>' : '✅ मूल सिम'}<br>
            <b>बैटरी स्तर:</b> ${data.battery_level || 'N/A'}%<br>
            <b>अंतिम अपडेट:</b> ${new Date(data.last_updated).toLocaleTimeString('hi-IN')}<br>
            <a href="https://www.google.com/maps/search/?api=1&query=${lat},${lon}" target="_blank" style="color:#0284c7;font-weight:bold;">Google Maps में देखें ↗</a>
          </div>
        `).openPopup();

      showMsg(statusBox, `लोकेशन लॉक: ${lat}, ${lon} | सिम: ${isSimChanged ? 'चेतावनी: सिम बदला गया है' : 'सामान्य'}`, isSimChanged ? 'warn' : 'ok');
    }

    function showMsg(el, text, type) {
      el.style.display = 'block';
      el.className = 'status-msg ' + (type === 'warn' ? 'status-warn' : 'status-ok');
      el.innerText = text;
    }
  </script>
</body>
</html>
